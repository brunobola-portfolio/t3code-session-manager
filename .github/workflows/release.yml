name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # npm provenance and Trusted Publishing: the registry checks that this workflow, on this repository, built it.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Tag matches the version in every manifest, pin and the changelog
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          node scripts/release.js --check

      - name: Tag points at a commit on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME is not on main; release from a merged commit"
            exit 1
          }

      - name: Install, typecheck, test, build
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Stage the release on npm (with provenance; a maintainer approves it with 2FA)
        env:
          # npm's Trusted Publisher for this workflow (OIDC, stage-only) needs no secret; NPM_TOKEN is only the fallback
          # while it is not configured. npm tries OIDC first, so an empty token is fine.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # The published build says it came from npm, so an install of it keeps updating from the registry. Set for
          # the whole step: npm runs `prepare` again on pack and publish (npm 10 even with --ignore-scripts).
          T3SM_BUILD_CHANNEL: npm
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          # Staged publishing needs npm 11.15 or newer, pinned here whatever the runner bundles.
          npm_cli() { npx -y npm@11.21.2 "$@"; }
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; nothing to stage"
            exit 0
          fi
          if npm_cli stage list "$name" --json 2>/dev/null | grep -q "\"$version\""; then
            echo "::notice::$name@$version is already staged: approve it on npmjs.com (Staged Packages) with 2FA"
            exit 0
          fi
          # Pack once, check the tarball itself, and stage exactly that file.
          tgz="$(npm pack --silent --pack-destination "$RUNNER_TEMP" | tail -n 1)"
          tar -xzOf "$RUNNER_TEMP/$tgz" package/dist/build.json | node -e "
            const b = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            if (b.channel !== 'npm' || b.version !== '$version') { console.error('not a channel npm build of $version:', b); process.exit(1); }"
          npm_cli stage publish "$RUNNER_TEMP/$tgz" --provenance --access public
          echo "::notice::Staged $name@$version with provenance. Approve it with 2FA: npmjs.com -> $name -> Staged Packages -> Approve"

      - name: Publish release notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="$(node scripts/release.js --repo)"
          name="$(node -p "require('./package.json').name")"
          node scripts/release.js --notes > notes.md
          cat >> notes.md <<NOTES

          **Install** (Node 22.18+): \`npm install -g $name\`, then run \`t3sm\` with T3 Code open. No install: \`npx -y $name@${GITHUB_REF_NAME#v} doctor\`.
          From GitHub instead: \`npm install -g --install-links github:$repo#$GITHUB_REF_NAME\`.
          Claude Code skill: \`/plugin marketplace add $repo\` then \`/plugin install t3sm@t3code-session-manager\`.
          NOTES
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag --latest
          fi
