name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Tag matches the version in every manifest, pin and the changelog
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          node scripts/release.js --check

      - name: Tag points at a commit on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME is not on main; release from a merged commit"
            exit 1
          }

      - name: Install, typecheck, test, build
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Publish release notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="$(node scripts/release.js --repo)"
          node scripts/release.js --notes > notes.md
          cat >> notes.md <<NOTES

          **Try it** (Node 22.18+, T3 Code open): \`npx -y github:$repo#$GITHUB_REF_NAME doctor\`, then \`plan\`, then \`apply\`.
          Install the command: \`npm install -g --install-links github:$repo#$GITHUB_REF_NAME\`.
          Claude Code skill: \`/plugin marketplace add $repo\` then \`/plugin install t3sm@t3code-session-manager\`.
          NOTES
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag --latest
          fi
