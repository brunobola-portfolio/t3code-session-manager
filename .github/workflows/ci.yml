name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, on the full matrix: a new runner image, Node release or npm breaks here first, not in a release.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 22.18 is the oldest supported Node, 24 and 26 the LTS lines users run.
        node: [22, 24, 26]
        # Pull requests run one macOS job (hosted macOS runners can queue for minutes) and Node 26 on Linux only;
        # main, the weekly run and a manual run cover all nine.
        exclude: ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"macos-latest","node":24},{"os":"macos-latest","node":26},{"os":"windows-latest","node":26}]' || '[]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      # The same on every OS and Node: once is enough.
      - run: npm run typecheck
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
      - run: npm test
      - run: npm run build
      - name: Versions, install pins and changelog agree
        run: node scripts/release.js --check
      - name: The README install line works (npm install -g from git)
        shell: bash
        run: |
          W="$GITHUB_WORKSPACE"; P="$RUNNER_TEMP/global"
          if [ "$RUNNER_OS" = "Windows" ]; then W="/$(cygpath -m "$W")"; P="$(cygpath -m "$P")"; B="$P/t3sm.cmd"; else B="$P/bin/t3sm"; fi
          npm install -g --install-links --prefix "$P" "git+file://$W#$GITHUB_SHA"
          got="$("$B" --version | tr -d '\r')"; want="$(node -p 'require("./package.json").version')"
          test "$got" = "$want" || { echo "installed t3sm says '$got', expected '$want'"; exit 1; }
          "$B" --help | grep -q "t3sm update"
      - name: The npm package installs and runs (npm pack, as the registry gets it)
        shell: bash
        env:
          # Built exactly as the Release workflow publishes it (npm runs `prepare` on pack, npm 10 even with
          # --ignore-scripts, so the channel is set for the whole step).
          T3SM_BUILD_CHANNEL: npm
        run: |
          P="$RUNNER_TEMP/npm-global"; D="$RUNNER_TEMP/pack"; mkdir -p "$D"
          if [ "$RUNNER_OS" = "Windows" ]; then P="$(cygpath -m "$P")"; D="$(cygpath -m "$D")"; B="$P/t3sm.cmd"; else B="$P/bin/t3sm"; fi
          tgz="$(npm pack --silent --pack-destination "$D" | tail -n 1)"
          npm install -g --prefix "$P" "$D/$tgz"
          if [ "$RUNNER_OS" = "Windows" ]; then R="$P/node_modules/t3code-session-manager"; else R="$P/lib/node_modules/t3code-session-manager"; fi
          node -e "process.exit(require(process.argv[1]).channel === 'npm' ? 0 : 1)" "$R/dist/build.json" || { echo "the packed build is not marked channel npm"; exit 1; }
          got="$("$B" --version | tr -d '\r')"; want="$(node -p 'require("./package.json").version')"
          test "$got" = "$want" || { echo "the packed t3sm says '$got', expected '$want'"; exit 1; }
          "$B" --help | grep -q "t3sm update"
          "$B" help updates | grep -q "npm"

      - name: README artwork is up to date
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: |
          node scripts/build-assets.js
          test -z "$(git status --porcelain -- docs/assets)" || { git status --porcelain -- docs/assets; git diff --stat -- docs/assets; exit 1; }

  # Single stable check name for branch protection, whatever the matrix becomes.
  ci-ok:
    name: ci-ok
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = "success"
