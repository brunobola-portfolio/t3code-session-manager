name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Versions, install pins and changelog agree
        run: node scripts/release.js --check
      - name: The README install line works (npm install -g from git)
        shell: bash
        run: |
          W="$GITHUB_WORKSPACE"; P="$RUNNER_TEMP/global"
          if [ "$RUNNER_OS" = "Windows" ]; then W="/$(cygpath -m "$W")"; P="$(cygpath -m "$P")"; B="$P/t3sm.cmd"; else B="$P/bin/t3sm"; fi
          npm install -g --install-links --prefix "$P" "git+file://$W#$GITHUB_SHA"
          got="$("$B" --version | tr -d '\r')"; want="$(node -p 'require("./package.json").version')"
          test "$got" = "$want" || { echo "installed t3sm says '$got', expected '$want'"; exit 1; }
          "$B" --help | grep -q "t3sm update"
      - name: README artwork is up to date
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: |
          node scripts/build-assets.js
          test -z "$(git status --porcelain -- docs/assets)" || { git status --porcelain -- docs/assets; git diff --stat -- docs/assets; exit 1; }

  # Single stable check name for branch protection, whatever the matrix becomes.
  ci-ok:
    name: ci-ok
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = "success"
