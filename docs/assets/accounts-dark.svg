<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img" aria-label="Choosing the subscription. A session belongs to the account whose folder holds it; copies in both accounts are compared (identical: one thread; prefix: the longer copy; diverged: two threads). A project's default account: routes in config.json, then the VS Code pin, then the most recent session, then defaultAccount.">
  <title>Choosing the subscription. A session belongs to the account whose folder holds it; copies in both accounts are compared (identical: one thread; prefix: the longer copy; diverged: two threads). A project's default account: routes in config.json, then the VS Code pin, then the most recent session, then defaultAccount.</title>
  <rect width="1280" height="470" rx="14" fill="#11151C"/>
  <rect x="0.5" y="0.5" width="1279" height="469" rx="14" fill="none" stroke="#283140"/>
  <rect x="48" y="40" width="560" height="398" rx="12" fill="none" stroke="#283140"/>
  <rect x="648" y="40" width="584" height="398" rx="12" fill="none" stroke="#283140"/>
  <text x="72" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#E8EBF1">Which account a session belongs to</text>
  <text x="672" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#E8EBF1">Which account a project opens with</text>
  <text x="72" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9CA5B7">The folder the transcript lives in is the truth.</text>
  
  <path d="M76,140 h18 l5,6 h33 v38 h-56 z" fill="#3A2918" stroke="#EFA25A" stroke-width="1.6" stroke-linejoin="round"/>
  <text x="146" y="160" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="600" fill="#E8EBF1">~/.claude</text>
  <text x="146" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#EFA25A">Personal subscription</text>
  
  <path d="M348,140 h18 l5,6 h33 v38 h-56 z" fill="#2C2347" stroke="#AC8BF5" stroke-width="1.6" stroke-linejoin="round"/>
  <text x="418" y="160" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="600" fill="#E8EBF1">~/.claude-work</text>
  <text x="418" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#AC8BF5">Work subscription</text>
  <text x="72" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9CA5B7">A session in both folders is compared by content:</text>
  
  <rect x="72" y="250" width="104" height="30" rx="6" fill="#202A47"/>
  <text x="124" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#7D94FF">identical</text>
  <text x="192" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9CA5B7">one thread, in the project's account</text>
  
  <rect x="72" y="292" width="104" height="30" rx="6" fill="#202A47"/>
  <text x="124" y="312" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#7D94FF">prefix</text>
  <text x="192" y="312" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9CA5B7">one thread, from the longer copy</text>
  
  <rect x="72" y="334" width="104" height="30" rx="6" fill="#202A47"/>
  <text x="124" y="354" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#7D94FF">diverged</text>
  <text x="192" y="354" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9CA5B7">two threads, one per account (a fork)</text>
  <text x="72" y="396" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#8D96A9">Stale copies can be moved aside with t3sm dedupe.</text>
  <text x="672" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9CA5B7">Used for new threads and for converted sessions.</text>
  <rect x="672" y="120" width="536" height="58" rx="10" fill="#181E28" stroke="#283140"/>
  <circle cx="704" cy="149" r="14" fill="#7D94FF"/>
  <text x="704" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#0E1220">1</text>
  <text x="732" y="145" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="600" fill="#E8EBF1">routes in config.json</text>
  <text x="732" y="167" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9CA5B7">Your explicit rule, first match wins</text>
  <path d="M704,178 v18" stroke="#7D94FF" stroke-width="2"/>
  <rect x="672" y="196" width="536" height="58" rx="10" fill="#181E28" stroke="#283140"/>
  <circle cx="704" cy="225" r="14" fill="#7D94FF"/>
  <text x="704" y="231" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#0E1220">2</text>
  <text x="732" y="221" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="600" fill="#E8EBF1">.vscode/settings.json</text>
  <text x="732" y="243" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9CA5B7">The account VS Code pins for the folder</text>
  <path d="M704,254 v18" stroke="#7D94FF" stroke-width="2"/>
  <rect x="672" y="272" width="536" height="58" rx="10" fill="#181E28" stroke="#283140"/>
  <circle cx="704" cy="301" r="14" fill="#7D94FF"/>
  <text x="704" y="307" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#0E1220">3</text>
  <text x="732" y="297" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="600" fill="#E8EBF1">Most recent session</text>
  <text x="732" y="319" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9CA5B7">The account you used there last</text>
  <path d="M704,330 v18" stroke="#7D94FF" stroke-width="2"/>
  <rect x="672" y="348" width="536" height="58" rx="10" fill="#181E28" stroke="#283140"/>
  <circle cx="704" cy="377" r="14" fill="#7D94FF"/>
  <text x="704" y="383" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#0E1220">4</text>
  <text x="732" y="373" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="600" fill="#E8EBF1">defaultAccount</text>
  <text x="732" y="395" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9CA5B7">Everything else</text>
</svg>
